<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اختبار حماية صندوق العائلة</title>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8f6f0;
      margin: 0;
      padding: 20px;
    }

    .card {
      max-width: 420px;
      margin: 60px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      box-sizing: border-box;
      font-size: 16px;
    }

    button {
      background: #153e32;
      color: white;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    #message {
      margin-top: 18px;
      line-height: 1.8;
    }
  </style>
</head>

<body>

<div class="card">

  <h2>اختبار تسجيل الدخول</h2>

  <p>
    هذه صفحة اختبار منفصلة ولا تعدّل البرنامج الرئيسي.
  </p>

  <form id="loginForm">

    <input
      id="email"
      type="email"
      placeholder="البريد الإلكتروني"
      required
    >

    <input
      id="password"
      type="password"
      placeholder="كلمة المرور"
      required
    >

    <button type="submit">
      تسجيل الدخول واختبار Firestore
    </button>

  </form>

  <div id="message"></div>

</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyCP2l51w69ryIwZjaatgQunAfpgfdmWYzc",
  authDomain: "family-fund-5ec38.firebaseapp.com",
  projectId: "family-fund-5ec38",
  storageBucket: "family-fund-5ec38.firebasestorage.app",
  messagingSenderId: "605017227656",
  appId: "1:605017227656:web:eee5d5fde42614a95bfa3d"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

const message = document.getElementById("message");

document.getElementById("loginForm").addEventListener(
  "submit",
  async function(e) {

    e.preventDefault();

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    message.textContent =
      "جاري التحقق من الحساب...";

    try {

      await auth.signInWithEmailAndPassword(
        email,
        password
      );

      message.textContent =
        "✅ نجح تسجيل الدخول. جاري اختبار بيانات الصندوق...";

      const doc = await db
        .collection("funds")
        .doc("family_fund_main")
        .get();

      if (doc.exists) {

        message.innerHTML =
          "✅ نجح تسجيل الدخول عبر Firebase.<br>" +
          "✅ نجح الوصول إلى بيانات صندوق العائلة.<br><br>" +
          "الاختبار ناجح.";

      } else {

        message.textContent =
          "⚠️ تم تسجيل الدخول ولكن مستند الصندوق غير موجود.";

      }

    } catch(error) {

      console.error(error);

      message.textContent =
        "❌ فشل الاختبار: " + error.code;

    }

  }
);

</script>

</body>
</html>
